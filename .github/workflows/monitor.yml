name: Shuttle Seats Monitor

on:
  schedule:
    # 每 15 分钟自动运行一次 (Cron 语法)
    - cron: '*/15 * * * *'
  workflow_dispatch: # 允许在 GitHub 网页上随时手动点击触发执行

jobs:
  check-seats:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v3

      - name: 2. 安装 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. 安装依赖库
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: 4. 执行车位监控脚本
        run: python monitor_once.py
